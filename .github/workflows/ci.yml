name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Check code formatting
      run: ./gradlew spotlessCheck

    - name: Run tests
      id: tests
      run: ./gradlew test --console=plain

    - name: Publish test report
      if: steps.tests.outcome == 'success' || steps.tests.outcome == 'failure'
      uses: dorny/test-reporter@v1
      with:
        name: Test Results
        path: build/test-results/test/*.xml
        reporter: java-junit
        fail-on-error: false

    - name: Run mutation tests
      if: steps.tests.outcome == 'success'
      id: mutation
      run: ./gradlew checkMutationCoverage

    - name: Deploy mutation report to GitHub Pages
      if: steps.mutation.outcome == 'success' || steps.mutation.outcome == 'failure'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./build/reports/pitest
        destination_dir: mutation-reports/${{ github.run_number }}
        keep_files: true

    - name: Publish mutation test results
      if: steps.mutation.outcome == 'success' || steps.mutation.outcome == 'failure'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const xmlPath = 'build/reports/pitest/mutations.xml';
          
          if (fs.existsSync(xmlPath)) {
            const xml = fs.readFileSync(xmlPath, 'utf8');
            const total = (xml.match(/<mutation/g) || []).length;
            const killed = (xml.match(/status="KILLED"/g) || []).length;
            const survived = (xml.match(/status="SURVIVED"/g) || []).length;
            const coverage = total > 0 ? Math.round((killed / total) * 100) : 0;
            const passed = coverage >= 70;
            
            const reportUrl = `https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/mutation-reports/${{ github.run_number }}/index.html`;
            
            await core.summary
              .addHeading('🧬 Mutation Testing Results', 2)
              .addTable([
                [{data: 'Metric', header: true}, {data: 'Value', header: true}],
                ['Total Mutations', `${total}`],
                ['Killed', `${killed} ✅`],
                ['Survived', `${survived} ⚠️`],
                ['Coverage', `**${coverage}%**`],
                ['Threshold', '70%'],
                ['Status', passed ? '✅ PASSED' : '⚠️ BELOW THRESHOLD']
              ])
              .addRaw(`\n📊 **[View Interactive HTML Report](${reportUrl})**\n`)
              .write();
