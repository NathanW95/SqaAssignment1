<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Create Post</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
  </head>
  <body>
    <header>
      <h1>Blog with Spring Boot</h1>
      <nav class="navbar">
        <ul>
          <li><a th:href="@{/}">Home</a></li>
          <li><a th:href="@{/create}">Create Post</a></li>
          <li><a th:href="@{/stats}">Stats</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <h1>Create Post</h1>
      <form th:action="@{/create}" method="post">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" placeholder="Title" required />
        
        <label for="author">Author</label>
        <input type="text" id="author" name="author" placeholder="Author" required />
        
        <label for="content">Content</label>
        <textarea id="content" name="content" placeholder="Content" required></textarea>
        
        <label for="tags">Tags (optional)</label>
        <input type="text" id="tags" name="tags" placeholder="Add Tags (comma-separated, e.g., Food, Travel)" />
        
        <button type="submit">Create</button>
      </form>
    </main>
  </body>
</html>
