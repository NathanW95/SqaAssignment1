<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Blog Posts</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
  </head>
  <body>
    <header>
      <h1>Blog with Spring Boot</h1>
      <nav class="navbar">
        <ul>
          <li><a th:href="@{/}">Home</a></li>
          <li><a th:href="@{/create}">Create Post</a></li>
          <li><a th:href="@{/stats}">Stats</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <h1>Blog Posts</h1>
      <div class="filter-indicator" th:if="${filterTag != null}">
        <span>Filtering by tag: <strong th:text="${filterTag}">tag</strong></span>
        <a th:href="@{/}" class="clear-filter-btn">Clear Filter</a>
      </div>
      <ul>
        <li th:each="post : ${posts}">
          <a th:href="@{'/post/' + ${post.id}}" class="post-card-link">
            <h2 class="post-title" th:text="${post.title}">Title</h2>
            <p class="post-meta">By <span th:text="${post.author}">Author</span> on <span th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd')}">Date</span></p>
            <div class="tags-container" th:if="${!post.tags.isEmpty()}">
              <span th:each="tag : ${post.tags}">
                <a th:href="@{${(filterTag != null && filterTag == tag.name) ? '/' : '/tag/' + tag.name}}" 
                   th:class="${filterTag != null && filterTag == tag.name} ? 'tag active' : 'tag'" 
                   th:text="${tag.name}">tag</a>
              </span>
            </div>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
